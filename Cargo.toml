[package]
name = "consul-client"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casey-digennaro/consul-client"
edition = "2021"
description = "Async Consul HTTP client with service discovery and KV store support"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
url = "2"
thiserror = "2"
tracing = "0.1"
